[package]
name = "kinora"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
local-ip-address = "0.6.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
