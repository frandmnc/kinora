[package]
name = "kinora-tray"
version = "0.3.0"
edition = "2024"
description = "Kinora en la bandeja de Windows: arranca el servidor, lo vuelve a levantar si se cae y lo apaga al salir"

# Es Kinora.exe: lo que abre el usuario. El servidor (kinora-server.exe) va al lado.
[[bin]]
name = "Kinora"
path = "src/main.rs"

[dependencies]
local-ip-address = "0.6.13"
png = "0.18.1"
serde_json = "1.0.154"
tao = "0.37.2"
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
strip = true
